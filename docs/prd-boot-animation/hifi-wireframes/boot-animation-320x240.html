<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>开机动画原型 - 320×240</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root {
      --color-primary: #7a5cff;
      --color-primary-hover: #6a48ff;
      --color-primary-light: rgba(122, 92, 255, 0.16);
      --color-secondary: #00e5ff;
      --color-secondary-light: rgba(0, 229, 255, 0.16);
      --color-accent: #ff3cac;
      --color-surface: #0a0f1f;
      --color-surface-alt: #121933;
      --color-border: rgba(108, 145, 255, 0.28);
      --color-border-hover: rgba(0, 229, 255, 0.48);
      --color-text-primary: #eef4ff;
      --color-text-secondary: #94a7d9;
      --color-text-tertiary: #6272a4;
      --color-success: #5df2a3;
      --gradient-primary: linear-gradient(135deg, #7a5cff 0%, #00e5ff 55%, #ff3cac 100%);
      --gradient-surface: radial-gradient(circle at top, rgba(122, 92, 255, 0.28), transparent 38%), linear-gradient(180deg, #0b1022 0%, #060913 100%);
      --font-display: 'DM Sans', 'Noto Sans SC', sans-serif;
      --font-body: 'Noto Sans SC', 'DM Sans', sans-serif;
      --shadow-glow: 0 0 18px rgba(0, 229, 255, 0.35), 0 0 36px rgba(122, 92, 255, 0.25);
      --shadow-pink: 0 0 18px rgba(255, 60, 172, 0.25);
      --radius-md: 14px;
      --radius-lg: 22px;
      --transition-base: 240ms ease;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 20% 20%, rgba(122, 92, 255, 0.25), transparent 22%),
        radial-gradient(circle at 80% 0%, rgba(0, 229, 255, 0.18), transparent 24%),
        #02040b;
      color: var(--color-text-primary);
      font-family: var(--font-body);
      padding: 24px;
    }

    .stage {
      display: grid;
      gap: 14px;
      justify-items: center;
    }

    .meta {
      font-size: 12px;
      color: var(--color-text-secondary);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .screen {
      position: relative;
      width: 320px;
      height: 240px;
      overflow: hidden;
      border-radius: var(--radius-lg);
      border: 1px solid var(--color-border);
      background: var(--gradient-surface);
      box-shadow: 0 22px 60px rgba(0, 0, 0, 0.55), var(--shadow-glow);
      isolation: isolate;
    }

    .screen::before,
    .screen::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .screen::before {
      background:
        linear-gradient(rgba(0, 229, 255, 0.1) 1px, transparent 1px),
        linear-gradient(90deg, rgba(122, 92, 255, 0.1) 1px, transparent 1px);
      background-size: 32px 32px;
      mask-image: linear-gradient(180deg, rgba(255, 255, 255, 0.7), transparent);
      opacity: 0.42;
    }

    .screen::after {
      background: repeating-linear-gradient(
        180deg,
        rgba(255, 255, 255, 0.06) 0,
        rgba(255, 255, 255, 0.06) 1px,
        transparent 1px,
        transparent 4px
      );
      mix-blend-mode: soft-light;
      opacity: 0.5;
    }

    .glow-orb,
    .glow-orb--alt {
      position: absolute;
      border-radius: 50%;
      filter: blur(12px);
      opacity: 0.7;
    }

    .glow-orb {
      width: 120px;
      height: 120px;
      left: -26px;
      top: -30px;
      background: rgba(122, 92, 255, 0.35);
      animation: drift 7s ease-in-out infinite alternate;
    }

    .glow-orb--alt {
      width: 110px;
      height: 110px;
      right: -28px;
      bottom: -34px;
      background: rgba(0, 229, 255, 0.25);
      animation: drift 6s ease-in-out infinite alternate-reverse;
    }

    .scan-beam {
      position: absolute;
      inset: -30% 0 auto;
      height: 58px;
      background: linear-gradient(180deg, transparent, rgba(0, 229, 255, 0.2), transparent);
      animation: scan 4s linear infinite;
      opacity: 0.8;
    }

    .frame {
      position: absolute;
      inset: 10px;
      border-radius: var(--radius-md);
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: linear-gradient(180deg, rgba(10, 16, 34, 0.72), rgba(6, 9, 19, 0.82));
      backdrop-filter: blur(4px);
      padding: 14px 14px 12px;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 10px;
    }

    .topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 10px;
      color: var(--color-text-secondary);
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 8px;
      border: 1px solid rgba(0, 229, 255, 0.3);
      border-radius: 999px;
      background: rgba(0, 229, 255, 0.08);
      box-shadow: inset 0 0 14px rgba(0, 229, 255, 0.08);
    }

    .hero {
      position: relative;
      display: grid;
      align-content: center;
      justify-items: center;
      gap: 10px;
      text-align: center;
    }

    .pulse-ring {
      position: absolute;
      width: 106px;
      height: 106px;
      border-radius: 50%;
      border: 1px solid rgba(0, 229, 255, 0.35);
      box-shadow: var(--shadow-glow);
      animation: pulse 2.8s ease-out infinite;
    }

    .pulse-ring::after {
      content: "";
      position: absolute;
      inset: 12px;
      border-radius: 50%;
      border: 1px dashed rgba(255, 60, 172, 0.3);
      animation: spin 8s linear infinite;
    }

    .brand-mark {
      width: 62px;
      height: 62px;
      border-radius: 20px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, rgba(122, 92, 255, 0.24), rgba(0, 229, 255, 0.18));
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: var(--shadow-glow), inset 0 0 24px rgba(255, 255, 255, 0.06);
      z-index: 1;
    }

    .brand-mark i {
      width: 28px;
      height: 28px;
      color: var(--color-secondary);
      filter: drop-shadow(0 0 8px rgba(0, 229, 255, 0.55));
    }

    .brand-title {
      font-family: var(--font-display);
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-shadow: 0 0 16px rgba(122, 92, 255, 0.4);
      z-index: 1;
    }

    .brand-subtitle {
      font-size: 11px;
      color: var(--color-text-secondary);
      letter-spacing: 0.28em;
      text-transform: uppercase;
      z-index: 1;
    }

    .boot-panel {
      display: grid;
      gap: 8px;
    }

    .status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      color: var(--color-text-secondary);
    }

    .status-row strong {
      color: var(--color-text-primary);
      font-weight: 600;
    }

    .progress-track {
      position: relative;
      height: 8px;
      border-radius: 999px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .progress-fill {
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: var(--gradient-primary);
      box-shadow: var(--shadow-glow), var(--shadow-pink);
      animation: progress 5.2s ease-in-out infinite;
    }

    .progress-fill::after {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      right: 0;
      width: 24px;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.55));
      filter: blur(2px);
    }

    .status-text {
      min-height: 18px;
      font-size: 12px;
      color: var(--color-secondary);
      text-shadow: 0 0 10px rgba(0, 229, 255, 0.35);
      transition: opacity var(--transition-base), transform var(--transition-base);
    }

    .boot-log {
      display: grid;
      gap: 3px;
      padding: 8px 10px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(2, 5, 14, 0.54);
      font-size: 10px;
      line-height: 1.35;
      color: var(--color-text-secondary);
    }

    .boot-log span {
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }

    .boot-log em {
      font-style: normal;
      color: var(--color-success);
    }

    .footer-note {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 10px;
      color: var(--color-text-tertiary);
      letter-spacing: 0.08em;
    }

    .signal {
      display: inline-flex;
      gap: 3px;
      align-items: end;
      height: 12px;
    }

    .signal b {
      width: 3px;
      border-radius: 999px;
      background: var(--gradient-primary);
      box-shadow: var(--shadow-glow);
      animation: equalize 1.4s ease-in-out infinite;
    }

    .signal b:nth-child(1) { height: 5px; animation-delay: 0s; }
    .signal b:nth-child(2) { height: 9px; animation-delay: 0.12s; }
    .signal b:nth-child(3) { height: 12px; animation-delay: 0.24s; }
    .signal b:nth-child(4) { height: 7px; animation-delay: 0.36s; }

    @keyframes pulse {
      0% { transform: scale(0.82); opacity: 0.8; }
      70% { transform: scale(1.18); opacity: 0; }
      100% { transform: scale(1.18); opacity: 0; }
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes progress {
      0%, 12% { width: 8%; }
      28% { width: 34%; }
      52% { width: 63%; }
      76% { width: 86%; }
      100% { width: 100%; }
    }

    @keyframes scan {
      0% { transform: translateY(-40px); }
      100% { transform: translateY(260px); }
    }

    @keyframes drift {
      from { transform: translate3d(0, 0, 0) scale(1); }
      to { transform: translate3d(10px, 8px, 0) scale(1.08); }
    }

    @keyframes equalize {
      0%, 100% { transform: scaleY(0.55); opacity: 0.65; }
      50% { transform: scaleY(1); opacity: 1; }
    }
  </style>
</head>
<body>
  <main class="stage">
    <div class="meta">320 × 240 / 赛博朋克开机动画</div>
    <section class="screen" aria-label="320×240 开机动画原型屏幕">
      <div class="glow-orb"></div>
      <div class="glow-orb--alt"></div>
      <div class="scan-beam"></div>

      <div class="frame">
        <header class="topline">
          <span class="pill"><i data-lucide="cpu"></i> 启动序列</span>
          <span>v2.4.9</span>
        </header>

        <section class="hero">
          <div class="pulse-ring" aria-hidden="true"></div>
          <div class="brand-mark" aria-hidden="true">
            <i data-lucide="hexagon"></i>
          </div>
          <div class="brand-title">霓境 OS</div>
          <div class="brand-subtitle">Neon Core Boot</div>
        </section>

        <section class="boot-panel">
          <div class="status-row">
            <strong id="progressValue">07%</strong>
            <span>系统初始化中</span>
          </div>
          <div class="progress-track" aria-hidden="true">
            <div class="progress-fill"></div>
          </div>
          <div class="status-text" id="statusText">加载光栅引擎...</div>
          <div class="boot-log">
            <span><em>OK</em><small>核心供电稳定</small></span>
            <span><em>OK</em><small>显示矩阵已点亮</small></span>
            <span><em>RUN</em><small id="logText">同步扫描协议...</small></span>
          </div>
          <div class="footer-note">
            <span>欢迎启动 · 城市夜色协议</span>
            <span class="signal" aria-hidden="true"><b></b><b></b><b></b><b></b></span>
          </div>
        </section>
      </div>
    </section>
  </main>

  <script>
    const progressValue = document.getElementById('progressValue');
    const statusText = document.getElementById('statusText');
    const logText = document.getElementById('logText');

    const frames = [
      { progress: '07%', status: '加载光栅引擎...', log: '同步扫描协议...' },
      { progress: '28%', status: '校准霓虹矩阵...', log: '建立城市网格...' },
      { progress: '52%', status: '注入启动脉冲...', log: '点亮主控回路...' },
      { progress: '86%', status: '部署视觉界面...', log: '装载欢迎场景...' },
      { progress: '100%', status: '启动完成，进入主界面', log: '等待用户唤醒...' }
    ];

    let current = 0;

    const renderFrame = () => {
      const frame = frames[current];
      statusText.style.opacity = '0.4';
      statusText.style.transform = 'translateY(2px)';

      window.setTimeout(() => {
        progressValue.textContent = frame.progress;
        statusText.textContent = frame.status;
        logText.textContent = frame.log;
        statusText.style.opacity = '1';
        statusText.style.transform = 'translateY(0)';
      }, 140);

      current = (current + 1) % frames.length;
    };

    renderFrame();
    window.setInterval(renderFrame, 1200);

    if (window.lucide) {
      window.lucide.createIcons();
    }
  </script>
</body>
</html>
